name: build-macos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - run: >
          xcodebuild -project CyberModStudio.xcodeproj -scheme CyberModStudio -configuration Release
          -destination 'platform=macOS' -derivedDataPath build build
